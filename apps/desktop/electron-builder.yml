appId: app.zoompane.desktop
productName: ZoomPane
copyright: Copyright © 2026 ZoomPane contributors
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - package.json
  - '!**/*.map'
extraResources:
  # The .NET capture sidecar (built by `npm run build:capture` at the repo root).
  - from: resources/bin
    to: bin
    filter: ['zoompane-capture.exe']
  # Window and tray icons loaded at runtime (see src/main/paths.ts).
  - from: build/icon.png
    to: icon.png
  - from: build/tray.png
    to: tray.png
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  executableName: ZoomPane
nsis:
  # Double-click to install: per-user, no admin prompt, launches when done.
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ZoomPane
  artifactName: ZoomPane-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false
portable:
  artifactName: ZoomPane-Portable-${version}.${ext}
publish:
  provider: github
  owner: jayspyroyale
  repo: ZoomPane
  releaseType: release
