appId: app.zoompane.desktop
productName: ZoomPane
copyright: Copyright © 2026 ZoomPane
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - package.json
  - '!**/*.map'
extraResources:
  # The .NET capture sidecar (built by `npm run build:capture` at the repo root).
  - from: resources/bin
    to: bin
    filter: ['zoompane-capture.exe']
  - from: resources/wallpapers
    to: wallpapers
asarUnpack:
  - resources/**
protocols:
  - name: ZoomPane
    schemes: [zoompane]
fileAssociations:
  - ext: zoompane
    name: ZoomPane Project
    description: ZoomPane recording project
    role: Editor
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  executableName: ZoomPane
  # Code signing: set CSC_LINK / CSC_KEY_PASSWORD (or Azure Trusted Signing) in CI.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ZoomPane
  artifactName: ZoomPane-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false
publish:
  provider: github
  releaseType: release
